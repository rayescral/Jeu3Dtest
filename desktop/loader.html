<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Tennis Club Simulator</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f1f17; color: #cfe; font: 18px system-ui, 'Segoe UI', sans-serif; }
    body { display: grid; place-items: center; letter-spacing: .08em; }
  </style>
</head>
<body>
  <div id="msg">Recherche de mises à jour…</div>
  <script>
    // Lanceur de l'application : au démarrage, il télécharge la dernière version du jeu publiée sur GitHub
    // (index.html, style.css, jeu.js), la garde en mémoire pour jouer hors connexion, puis l'affiche.
    // Sans connexion, il utilise la dernière version téléchargée, sinon celle livrée avec le programme.
    const REMOTE = 'https://raw.githubusercontent.com/rayescral/jeu3dtest/claude/gallant-pasteur-0xlwe2/';
    const FILES = ['index.html', 'style.css', 'jeu.js'];
    const CACHE = 'tennis-club-sim-update';

    const withTimeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('délai dépassé')), ms))]);
    async function download() {
      const stamp = Date.now();
      const texts = await withTimeout(Promise.all(FILES.map(f => fetch(REMOTE + f + '?t=' + stamp, { cache: 'no-store' })
        .then(r => { if (!r.ok) throw new Error(f + ' ' + r.status); return r.text(); }))), 8000);
      const [html, css, js] = texts;
      if (!html.includes('jeu.js') || js.length < 10000) throw new Error('fichiers incomplets');
      return { html, css, js };
    }
    function launch({ html, css, js }) {
      const cssUrl = URL.createObjectURL(new Blob([css], { type: 'text/css' }));
      const jsUrl = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }));
      const page = html.replace('href="style.css"', `href="${cssUrl}"`).replace('src="jeu.js"', `src="${jsUrl}"`);
      document.open(); document.write(page); document.close();
    }
    (async () => {
      try {
        const files = await download();
        try { localStorage.setItem(CACHE, JSON.stringify(files)); } catch { /* mémoire pleine : tant pis */ }
        return launch(files);
      } catch (e) {
        try { const saved = JSON.parse(localStorage.getItem(CACHE)); if (saved?.js) return launch(saved); } catch { /* rien */ }
        location.replace('game/index.html');
      }
    })();
  </script>
</body>
</html>
